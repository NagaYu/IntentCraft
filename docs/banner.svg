<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#161a35"/>
      <stop offset="1" stop-color="#241640"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e9eff"/>
      <stop offset="0.5" stop-color="#a06bff"/>
      <stop offset="1" stop-color="#ff6bd0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a06bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a06bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="260" fill="url(#glow)"/>

  <!-- wand icon -->
  <g transform="translate(120,140)">
    <circle r="62" fill="#ffffff" fill-opacity="0.06" stroke="url(#accent)" stroke-width="2"/>
    <g transform="translate(-30,-30) scale(1.0)" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" fill="none">
      <line x1="6" y1="54" x2="46" y2="14"/>
      <path d="M44 6 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 z" fill="url(#accent)" stroke="none"/>
    </g>
    <g fill="#ffd86b">
      <path d="M-6 -34 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z"/>
      <path d="M40 40 l1.5 4.5 l4.5 1.5 l-4.5 1.5 l-1.5 4.5 l-1.5 -4.5 l-4.5 -1.5 l4.5 -1.5 z"/>
    </g>
  </g>

  <!-- title -->
  <text x="232" y="150" font-size="76" font-weight="700" fill="#ffffff">IntentCraft</text>
  <text x="234" y="200" font-size="27" font-weight="500" fill="#c7c9e0">Turn your Swift code into Siri &amp; Apple Intelligence integrations</text>
  <text x="234" y="236" font-size="27" font-weight="500" fill="url(#accent)">— 100% on-device.</text>

  <!-- pills -->
  <g font-size="18" font-weight="600">
    <g transform="translate(234,272)">
      <rect width="232" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="22" y="26" fill="#e8e8f5">🧠 Apple FoundationModels</text>
    </g>
    <g transform="translate(478,272)">
      <rect width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="22" y="26" fill="#e8e8f5">🔒 Fully offline</text>
    </g>
    <g transform="translate(640,272)">
      <rect width="186" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="22" y="26" fill="#e8e8f5">⌨️ CLI + 🖥️ macOS app</text>
    </g>
    <g transform="translate(838,272)">
      <rect width="120" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="22" y="26" fill="#e8e8f5">⚖️ MIT</text>
    </g>
  </g>
</svg>
