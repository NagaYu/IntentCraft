<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1222"/><stop offset="1" stop-color="#1a1530"/>
    </linearGradient>
    <linearGradient id="acc2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e9eff"/><stop offset="1" stop-color="#a06bff"/>
    </linearGradient>
    <style>
      .mono { font-family: 'SF Mono','JetBrains Mono',Menlo,Consolas,monospace; }
      .kw { fill:#ff7ab2; } .ty { fill:#7ee787; } .at { fill:#d2a8ff; } .str { fill:#a5d6ff; } .pl { fill:#e6edf3; } .cm { fill:#8b949e; }
      .h { fill:#c7c9e0; font-size:18px; font-weight:600; }
    </style>
  </defs>
  <rect width="1200" height="520" rx="20" fill="url(#bg2)"/>
  <text x="600" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">How it works</text>

  <!-- INPUT card -->
  <g transform="translate(48,90)">
    <rect width="430" height="380" rx="14" fill="#0d1117" stroke="#30363d"/>
    <rect width="430" height="40" rx="14" fill="#161b22"/>
    <rect y="26" width="430" height="14" fill="#161b22"/>
    <circle cx="22" cy="20" r="6" fill="#ff5f56"/><circle cx="42" cy="20" r="6" fill="#ffbd2e"/><circle cx="62" cy="20" r="6" fill="#27c93f"/>
    <text x="200" y="25" class="mono" font-size="13" fill="#8b949e">TaskStore.swift  (your code)</text>
    <g class="mono" font-size="15" transform="translate(22,72)">
      <text y="0"><tspan class="kw">final class</tspan><tspan class="ty"> TaskStore</tspan><tspan class="pl"> {</tspan></text>
      <text y="30"><tspan class="pl">  </tspan><tspan class="kw">func</tspan><tspan class="pl"> </tspan><tspan class="ty">addTask</tspan><tspan class="pl">(title: </tspan><tspan class="ty">String</tspan><tspan class="pl">)</tspan></text>
      <text y="54"><tspan class="pl">       -&gt; </tspan><tspan class="ty">TodoTask</tspan><tspan class="pl"> { … }</tspan></text>
      <text y="92"><tspan class="pl">  </tspan><tspan class="kw">func</tspan><tspan class="pl"> </tspan><tspan class="ty">completeTask</tspan><tspan class="pl">(</tspan></text>
      <text y="116"><tspan class="pl">       named title: </tspan><tspan class="ty">String</tspan><tspan class="pl">) { … }</tspan></text>
      <text y="154"><tspan class="pl">  </tspan><tspan class="kw">func</tspan><tspan class="pl"> </tspan><tspan class="ty">openTaskCount</tspan><tspan class="pl">()</tspan></text>
      <text y="178"><tspan class="pl">       -&gt; </tspan><tspan class="ty">Int</tspan><tspan class="pl"> { … }</tspan></text>
      <text y="216"><tspan class="pl">}</tspan></text>
    </g>
    <text x="200" y="372" text-anchor="middle" class="h" fill="#8b949e">Plain functions &amp; structs</text>
  </g>

  <!-- arrow / engine -->
  <g transform="translate(508,280)">
    <circle r="64" fill="#ffffff" fill-opacity="0.05" stroke="url(#acc2)" stroke-width="2"/>
    <text y="-6" text-anchor="middle" font-size="34">🪄</text>
    <text y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#c7c9e0">on-device</text>
    <text y="42" text-anchor="middle" font-size="12" font-weight="700" fill="#c7c9e0">LLM</text>
    <path d="M-86 0 h-8 M70 0 h16" stroke="url(#acc2)" stroke-width="3" fill="none"/>
    <path d="M84 -7 l12 7 l-12 7 z" fill="#a06bff"/>
    <path d="M-94 -7 l-12 7 l12 7 z" fill="#5e9eff"/>
  </g>

  <!-- OUTPUT card -->
  <g transform="translate(700,90)">
    <rect width="452" height="380" rx="14" fill="#0d1117" stroke="#30363d"/>
    <rect width="452" height="40" rx="14" fill="#161b22"/>
    <rect y="26" width="452" height="14" fill="#161b22"/>
    <circle cx="22" cy="20" r="6" fill="#ff5f56"/><circle cx="42" cy="20" r="6" fill="#ffbd2e"/><circle cx="62" cy="20" r="6" fill="#27c93f"/>
    <text x="210" y="25" class="mono" font-size="13" fill="#7ee787">AppIntents.swift  (generated ✨)</text>
    <g class="mono" font-size="14" transform="translate(20,68)">
      <text y="0"><tspan class="kw">import</tspan><tspan class="pl"> AppIntents</tspan></text>
      <text y="30"><tspan class="kw">struct</tspan><tspan class="ty"> AddTaskIntent</tspan><tspan class="pl">: </tspan><tspan class="ty">AppIntent</tspan><tspan class="pl"> {</tspan></text>
      <text y="52"><tspan class="pl">  </tspan><tspan class="kw">static var</tspan><tspan class="pl"> title</tspan><tspan class="pl">: </tspan><tspan class="ty">LocalizedStringResource</tspan></text>
      <text y="72"><tspan class="pl">    = </tspan><tspan class="str">"Add Task"</tspan></text>
      <text y="100"><tspan class="at">  @Parameter</tspan><tspan class="pl">(title: </tspan><tspan class="str">"Title"</tspan><tspan class="pl">)</tspan></text>
      <text y="120"><tspan class="pl">  </tspan><tspan class="kw">var</tspan><tspan class="pl"> title: </tspan><tspan class="ty">String</tspan></text>
      <text y="148"><tspan class="pl">  </tspan><tspan class="kw">func</tspan><tspan class="pl"> </tspan><tspan class="ty">perform</tspan><tspan class="pl">() </tspan><tspan class="kw">async throws</tspan></text>
      <text y="168"><tspan class="pl">    -&gt; </tspan><tspan class="kw">some</tspan><tspan class="ty"> IntentResult</tspan><tspan class="pl"> {</tspan></text>
      <text y="188"><tspan class="pl">    TaskStore.shared.</tspan><tspan class="ty">addTask</tspan><tspan class="pl">(title: title)</tspan></text>
      <text y="208"><tspan class="pl">    </tspan><tspan class="kw">return</tspan><tspan class="pl"> .result() } }</tspan></text>
      <text y="240"><tspan class="cm">// + AppEntity &amp; AppShortcutsProvider</tspan></text>
      <text y="260"><tspan class="cm">//   with Siri phrases, auto-generated</tspan></text>
    </g>
    <text x="226" y="372" text-anchor="middle" class="h" fill="#7ee787">Paste into Xcode → Siri-ready ✅</text>
  </g>
</svg>
